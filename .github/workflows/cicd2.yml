name: VPN and SSH Workflow

on:
  push:
    branches:
      - main

jobs:
  vpn-ssh:
    runs-on: ubuntu-latest

    env:
      USERNAME: "safiullah"
      SECRET_KEY: "CQDKAZCPPZY3SLCBK6VZP5DU74"
      VPN_PASSWORD: "vpn@d2s@321"  # Replace with actual password for testing
      SSH_PASSWORD: "d2sqa"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y expect oathtool sshpass openconnect

      - name: Connect to VPN
        run: |
          chmod +x expect_vpn.exp
          expect expect_vpn.exp > vpn_connect.log 2>&1
        continue-on-error: true  # Proceed even if there are errors in the log
      
      - name: Output VPN Log
        run: cat vpn_connect.log
     
      - name: Check Network Interfaces After VPN Connection
        run: ifconfig

      - name: Test VPN Connection
        run: ping -c 4 10.16.0.131

      - name: SSH into Remote Server
        run: |
          sshpass -p "$SSH_PASSWORD" ssh -v -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
          -o PreferredAuthentications=password -o PubkeyAuthentication=no \
          d2sqa@10.16.0.131 "echo Successfully SSHed into D2SQA"
          echo "Successfully SSHed into TMDS and D2SQA"
